// android/build.gradle

// Modernized build configuration for React Native Static Server
// Requires Gradle 9.0+ and Android Gradle Plugin 8.0+

def DEFAULT_BUILD_TOOLS_VERSION = '35.0.0'
def DEFAULT_MIN_SDK = 24
def DEFAULT_COMPILE_SDK = 35
def DEFAULT_TARGET_SDK = 35

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // The Android Gradle plugin is only required when opening the android folder stand-alone.
    // This avoids unnecessary downloads and potential conflicts when the library is included as a
    // module dependency in an application project.
    // ref: https://docs.gradle.org/current/userguide/tutorial_using_tasks.html#sec:build_script_external_dependencies
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:3.4.1'
        }
    }
}

apply plugin: 'com.android.library'

android {
    // Use compileSdk (required by AGP 8.0+), but support both naming conventions in ext
    compileSdk safeExtGet('compileSdk', safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK))
    buildToolsVersion safeExtGet('buildToolsVersion', DEFAULT_BUILD_TOOLS_VERSION)
    
    defaultConfig {
        // Use minSdk (required by AGP 8.0+), but support both naming conventions in ext
        minSdk safeExtGet('minSdk', safeExtGet('minSdkVersion', DEFAULT_MIN_SDK))
        // Use targetSdk (required by AGP 8.0+), but support both naming conventions in ext
        targetSdk safeExtGet('targetSdk', safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK))
        versionCode 1
        versionName "1.0"
    }
    lint {
        abortOnError false
    }
}

repositories {
    // ref: https://www.baeldung.com/maven-local-repository
    mavenLocal()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url "$rootDir/../node_modules/react-native/android"
    }
    maven {
        // Android JSC is installed from npm
        url "$rootDir/../node_modules/jsc-android/dist"
    }
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'  // From node_modules
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-webserver:2.3.1'
}

def configureReactNativePom(def pom) {
    def packageJson = new groovy.json.JsonSlurper().parseText(file('../package.json').text)

    pom.project {
        name packageJson.title
        artifactId packageJson.name
        version = packageJson.version
        group = "com.futurepress.staticserver"
        description packageJson.description
        url packageJson.repository.baseUrl

        licenses {
            license {
                name packageJson.license
                url packageJson.repository.baseUrl + '/blob/master/' + packageJson.licenseFilename
                distribution 'repo'
            }
        }

        developers {
            developer {
                id packageJson.author.username
                name packageJson.author.name
            }
        }
    }
}

afterEvaluate { project ->
    // Modernized Gradle build hooks
    // References:
    // https://www.oreilly.com/library/view/gradle-beyond-the/9781449373801/ch03.html
    // https://developer.android.com/studio/releases/gradle-plugin
    
    task androidJavadoc(type: Javadoc) {
        source = android.sourceSets.main.java.srcDirs
        classpath += files(android.bootClasspath)
        // Use implementation configuration (compile is deprecated in Gradle 7.0+)
        // Enable resolution for implementation configuration to use in classpath
        configurations.implementation.setCanBeResolved(true)
        classpath += files(configurations.implementation)
        include '**/*.java'
    }

    task androidJavadocJar(type: Jar, dependsOn: androidJavadoc) {
        archiveClassifier.set('javadoc')
        // Javadoc task uses destinationDir (File property) - this is the standard property
        from androidJavadoc.destinationDir
    }

    task androidSourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from android.sourceSets.main.java.srcDirs
        include '**/*.java'
    }

    android.libraryVariants.all { variant ->
        def name = variant.name.capitalize()
        def javaCompileTask = variant.javaCompileProvider.get()

        task "jar${name}"(type: Jar, dependsOn: javaCompileTask) {
            from javaCompileTask.destinationDirectory
        }
    }

    artifacts {
        archives androidSourcesJar
        archives androidJavadocJar
    }

    // Note: Maven plugin was removed in Gradle 9.0
    // The installArchives task is not needed for the library to function as a dependency
    // If you need local maven publishing, consider using maven-publish plugin instead
}
